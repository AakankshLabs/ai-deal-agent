name: Live browser tests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-browser.yml"
      - "tests/test_live_browser.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-browser-tests
  cancel-in-progress: true

jobs:
  browser-smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application and browser-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt playwright
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Test deployed Streamlit application
        env:
          AI_DEAL_AGENT_URL: https://ai-deal-agent-8rzwdsvxlrxjwtmpripdjw.streamlit.app/
        run: python -m unittest discover -s tests -p "test_live_browser.py" -v
